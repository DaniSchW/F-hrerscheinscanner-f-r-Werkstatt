services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fs_scanner
      POSTGRES_PASSWORD: fs_scanner
      POSTGRES_DB: fuehrerscheinscanner
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
